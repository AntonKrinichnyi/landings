services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  landings:
    build:
      context: .
      dockerfile: landings_app/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./landings_app/.env
    depends_on:
      redis:
        condition: service_healthy

  core:
    build:
      context: .
      dockerfile: core_app/Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - ./core_app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic -c core_app/db/alembic.ini upgrade head && uvicorn core_app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
